name: Update FlorAccess Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scrape public FlorAccess catalogue
        run: python scraper.py

      - name: Upload Excel workbook
        uses: actions/upload-artifact@v4
        with:
          name: floraccess-catalogue-xlsx
          path: data/floraccess_catalogue.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/floraccess_catalogue.csv
          git diff --cached --quiet || git commit -m "Update FlorAccess catalogue"
          git push
