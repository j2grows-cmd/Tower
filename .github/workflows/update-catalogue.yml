name: Update FlorAccess Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -u -m pip install -r requirements.txt
          python -u -c "import playwright; print('Playwright import OK')"

      - name: Install Chromium
        run: python -u -m playwright install --with-deps chromium

      - name: Test Chromium launch
        run: |
          python -u - <<'PY'
          from playwright.sync_api import sync_playwright
          print('Launching Chromium...')
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print('Opening FlorAccess...')
              page.goto('https://www.floraccess.com/en/search/', wait_until='domcontentloaded', timeout=60000)
              print('Page loaded:', page.title())
              print('URL:', page.url)
              print('Body characters:', len(page.locator('body').inner_text()))
              browser.close()
          print('Chromium smoke test OK')
          PY

      - name: Scrape public FlorAccess catalogue
        run: python -u scraper.py

      - name: Upload Excel workbook
        uses: actions/upload-artifact@v4
        with:
          name: floraccess-catalogue-xlsx
          path: data/floraccess_catalogue.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/floraccess_catalogue.csv
          git diff --cached --quiet || git commit -m "Update FlorAccess catalogue"
          git push
