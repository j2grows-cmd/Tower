<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="Tower — an idle defense game prototype.">
  <title>Tower — Idle Defense</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">IDLE DEFENSE</p>
        <h1>TOWER</h1>
      </div>
      <div class="currency" aria-label="Coins">
        <span class="coin-icon">◈</span>
        <span id="coins">0</span>
      </div>
    </header>

    <section class="status-grid" aria-label="Run status">
      <div class="stat-card"><span>WAVE</span><strong id="wave">1</strong></div>
      <div class="stat-card"><span>ENEMIES</span><strong id="enemies">0</strong></div>
      <div class="stat-card"><span>BEST WAVE</span><strong id="best-wave">0</strong></div>
    </section>

    <section class="battle-panel">
      <div class="battle-head">
        <div>
          <span class="label">TOWER CORE</span>
          <div class="health-row"><strong id="tower-hp">100 / 100</strong><span id="tower-level">LV 1</span></div>
        </div>
        <div class="wave-state" id="wave-state">WAVE 1</div>
      </div>
      <div class="health-bar"><div id="tower-health-fill"></div></div>
      <canvas id="game" aria-label="Tower defense battlefield"></canvas>
      <div class="battle-foot">
        <span id="wave-progress">0 / 5 defeated</span>
        <span id="combat-message">Systems online</span>
      </div>
    </section>

    <section class="upgrade-panel">
      <div class="section-heading">
        <div>
          <span class="label">UPGRADES</span>
          <h2>Strengthen the tower</h2>
        </div>
        <button class="reset-button" id="reset" type="button">Restart</button>
      </div>
      <div class="upgrade-grid">
        <button class="upgrade" data-upgrade="damage" type="button">
          <span class="upgrade-icon">⚔</span>
          <span class="upgrade-copy"><b>Damage</b><small id="damage-value">10 → 12</small></span>
          <span class="cost"><span>◈</span><span id="damage-cost">25</span></span>
        </button>
        <button class="upgrade" data-upgrade="speed" type="button">
          <span class="upgrade-icon">↯</span>
          <span class="upgrade-copy"><b>Attack Speed</b><small id="speed-value">1.0 /s → 1.1 /s</small></span>
          <span class="cost"><span>◈</span><span id="speed-cost">30</span></span>
        </button>
        <button class="upgrade" data-upgrade="range" type="button">
          <span class="upgrade-icon">◎</span>
          <span class="upgrade-copy"><b>Range</b><small id="range-value">210 → 225</small></span>
          <span class="cost"><span>◈</span><span id="range-cost">35</span></span>
        </button>
        <button class="upgrade" data-upgrade="health" type="button">
          <span class="upgrade-icon">✚</span>
          <span class="upgrade-copy"><b>Max Health</b><small id="health-value">100 → 120</small></span>
          <span class="cost"><span>◈</span><span id="health-cost">40</span></span>
        </button>
      </div>
    </section>

    <footer><span>PHASE 1 PROTOTYPE</span><span>AUTO-COMBAT ENABLED</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
